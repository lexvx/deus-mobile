name: Open WebUI Release Watch

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialize scheduled/manual runs and always read current state from main.
concurrency:
  group: open-webui-release-watch
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code and current delivery state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch latest open-webui release
        id: latest_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/open-webui/open-webui/releases/latest > "$RUNNER_TEMP/open-webui-release.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/open-webui-release.json') as source:
              release = json.load(source)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('tag_name', 'html_url'):
                  value = release.get(key)
                  if not isinstance(value, str) or not value or '\n' in value or '\r' in value:
                      raise ValueError('Invalid release ' + key)
                  output.write(f'{key}={value}\n')
          PY

      - name: Detect unacknowledged release
        id: compare
        env:
          RELEASE_TAG: ${{ steps.latest_release.outputs.tag_name }}
        run: python3 .github/scripts/open_webui_release_watch.py detect

      - name: Deliver Google Chat notification
        id: notify
        if: steps.compare.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.latest_release.outputs.tag_name }}
          RELEASE_URL: ${{ steps.latest_release.outputs.html_url }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
        run: python3 .github/scripts/open_webui_release_watch.py notify

      - name: Save acknowledged release
        if: steps.compare.outputs.changed == 'true' && steps.notify.outcome == 'success'
        env:
          RELEASE_TAG: ${{ steps.latest_release.outputs.tag_name }}
        run: |
          set -euo pipefail
          python3 .github/scripts/open_webui_release_watch.py save
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/state/open-webui-last-release.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: acknowledge open-webui release ${RELEASE_TAG}"
            # Retry only persistence, never resend within this run.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase origin/main
            done
            exit 1
          fi
