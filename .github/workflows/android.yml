name: Deus Android APK
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Remove upstream debug signing from release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/mobile/android/app/build.gradle')
          s=p.read_text().replace('signingConfig signingConfigs.debug', '')
          p.write_text(s)
          PY
      - name: Build standalone APK
        working-directory: apps/mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64 -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g'
      - uses: actions/upload-artifact@v4
        with:
          name: deus-android-unsigned
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

